<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eaf4ff">
  <title>Presente Joana 2</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px;
      background: linear-gradient(145deg, #eaf4ff, #d5e9ff 55%, #f5faff);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #163b68;
    }
    .card {
      width: min(100%, 440px); padding: 26px 20px 22px; text-align: center;
      background: #fff; border: 2px solid #6aa7e8; border-radius: 28px;
      box-shadow: 0 18px 50px #1e5e9c20; overflow: hidden;
    }
    .topline { font-size: 13px; letter-spacing: 3px; font-weight: 800; color: #477fba; }
    h1 { font-size: clamp(31px, 8vw, 39px); margin: 8px 0 7px; color: #175a9c; letter-spacing: -1px; }
    .subtitle { margin: 0 auto 22px; max-width: 300px; line-height: 1.55; color: #52749a; }
    .reveal-area {
      min-height: 205px; border-radius: 20px; border: 1px solid #bddafa;
      background: linear-gradient(145deg, #f5faff, #e4f1ff);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 22px;
    }
    .gift-icon { font-size: 54px; margin-bottom: 8px; }
    .prompt { font-size: 14px; letter-spacing: 2px; font-weight: 850; color: #386b9f; }
    /* O prêmio fica oculto até a classe .show ser adicionada pelo JavaScript. */
    #prize[hidden] { display: none !important; }
    #prize { margin-top: 8px; }
    #prize.show { animation: pop .45s ease-out; }
    .big-prize { font-size: clamp(32px, 8vw, 42px); font-weight: 950; line-height: 1.08; color: #1265b0; margin: 10px 0; }
    .note { font-size: 13px; color: #52749a; }
    .hint { font-size: 14px; margin: 15px 0 0; color: #52749a; }
    .status { min-height: 27px; margin-top: 12px; font-weight: 800; color: #1764a8; }
    button {
      border: 0; border-radius: 999px; padding: 13px 20px; margin-top: 8px;
      color: #fff; background: #1768b4; font-size: 15px; font-weight: 800;
      box-shadow: 0 5px 0 #0d477e; cursor: pointer;
    }
    button:active { transform: translateY(2px); box-shadow: 0 3px 0 #0d477e; }
    button:disabled { opacity: .7; cursor: default; }
    .footer { font-size: 12px; margin-top: 20px; color: #7b9fc4; }
    @keyframes pop { from { opacity: 0; transform: scale(.8); } to { opacity: 1; transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { #prize.show { animation: none; } }
  </style>
</head>
<body>
  <main class="card">
    <div class="topline">UM PRESENTE ESPECIAL 💙</div>
    <h1>Cupom Joana</h1>
    <p class="subtitle">Joana, prepare-se para descobrir seu presente!<br>Toque no botão abaixo 💌</p>

    <section class="reveal-area" aria-live="polite">
      <div class="gift-icon" id="giftIcon">🎁</div>
      <div class="prompt" id="prompt">SEU PRESENTE ESTÁ AQUI</div>

      <div id="prize" hidden>
        <div class="big-prize">Massagem<br>Grátis 💙</div>
        <div class="note">Um carinho preparado especialmente para você 🥰</div>
      </div>
    </section>

    <p class="hint" id="hint">Aperte o botão para revelar a surpresa.</p>
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <button id="revealBtn" type="button">Revelar meu presente 💙</button>
    <div class="footer">Feito com carinho para Joana</div>
  </main>

  <script>
    (() => {
      const prize = document.getElementById('prize');
      const giftIcon = document.getElementById('giftIcon');
      const prompt = document.getElementById('prompt');
      const hint = document.getElementById('hint');
      const status = document.getElementById('status');
      const button = document.getElementById('revealBtn');

      button.addEventListener('click', () => {
        // hidden controla a visibilidade real do prêmio antes da interação.
        prize.hidden = false;
        prize.classList.add('show');

        giftIcon.textContent = '💙';
        prompt.textContent = 'VOCÊ GANHOU';
        hint.textContent = 'Surpresa revelada! ✨';
        status.textContent = '🎉 Aproveite seu presente, Joana!';
        button.textContent = 'Presente revelado 💙';
        button.disabled = true;
      });
    })();
  </script>
</body>
</html>
